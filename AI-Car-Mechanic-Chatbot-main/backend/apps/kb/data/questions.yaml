# 1-2: engine_no_crank
- key: q_no_crank_lights
  text: "When you try to start the car, do the dashboard lights turn on?"
  applies_when: [engine_no_crank]
  options:
    - id: lights_completely_off
      label: "Completely dark, no lights at all"
      keywords: ["dark", "no lights", "dead", "completely dark"]
      effects: {dead_battery: 0.6, weak_battery: 0.2}
    - id: lights_dim_flicker
      label: "Lights turn on but dim down heavily"
      keywords: ["dim", "flicker", "weak lights"]
      effects: {weak_battery: 0.5, dead_battery: 0.4}
    - id: lights_bright_normal
      label: "Lights remain bright and clear"
      keywords: ["bright", "normal", "fine"]
      effects: {faulty_starter_motor: 0.7, dead_battery: -0.3}

- key: q_no_crank_sound
  text: "Do you hear any sound from the engine bay when turning the key?"
  applies_when: [engine_no_crank]
  options:
    - id: single_click
      label: "A single distinct click sound"
      keywords: ["single click", "one click", "click"]
      effects: {faulty_starter_motor: 0.6, dead_battery: 0.2}
    - id: total_silence
      label: "Total silence, no noise at all"
      keywords: ["total silence", "silent", "nothing", "quiet"]
      effects: {dead_battery: 0.7, faulty_starter_motor: 0.1}

# 3-4: engine_cranks_no_start
- key: q_cranks_smell
  text: "While cranking repeatedly, do you smell unburned petrol?"
  applies_when: [engine_cranks_no_start]
  options:
    - id: strong_petrol_smell
      label: "Yes, strong petrol odor near engine"
      keywords: ["yes", "fuel smell", "petrol smell", "flooded"]
      effects: {faulty_spark_plugs: 0.5, bad_ignition_coils: 0.4, fuel_pump_failure: -0.4}
    - id: no_petrol_smell
      label: "No smell of fuel at all"
      keywords: ["no", "no smell", "clean"]
      effects: {fuel_pump_failure: 0.6, clogged_fuel_filter: 0.4}

- key: q_cranks_spark
  text: "Did this starting failure happen suddenly or gradually over days?"
  applies_when: [engine_cranks_no_start]
  options:
    - id: died_suddenly
      label: "Suddenly stopped starting today"
      keywords: ["suddenly", "all of a sudden", "today"]
      effects: {fuel_pump_failure: 0.6, crankshaft_position_sensor_failure: 0.5}
    - id: hard_starting_recently
      label: "Had trouble starting over the past week"
      keywords: ["gradually", "past week", "struggling for days"]
      effects: {clogged_fuel_filter: 0.5, faulty_spark_plugs: 0.4}

# 5-6: slow_crank_click
- key: q_slow_crank_temp
  text: "Is the slow cranking worse in the early morning or when cold?"
  applies_when: [slow_crank_click]
  options:
    - id: worse_in_cold_morning
      label: "Much worse first thing in the morning"
      keywords: ["morning", "cold morning", "cold start"]
      effects: {weak_battery: 0.6, dead_battery: 0.3}
    - id: happens_even_when_warm
      label: "Happens equally even after driving"
      keywords: ["warm", "always", "after driving"]
      effects: {faulty_starter_motor: 0.5, weak_battery: 0.3}

- key: q_slow_crank_age
  text: "Approximately how old is your car battery?"
  applies_when: [slow_crank_click]
  options:
    - id: battery_over_3_years
      label: "Older than 3 years or unknown"
      keywords: ["old", "3 years", "4 years", "unknown"]
      effects: {weak_battery: 0.7, dead_battery: 0.4}
    - id: battery_under_1_year
      label: "Less than a year old"
      keywords: ["new", "recent", "few months", "1 year"]
      effects: {faulty_starter_motor: 0.5, parasitic_draw: 0.4, weak_battery: -0.3}

# 7-8: engine_stalls
- key: q_stalls_when
  text: "When does the engine typically stall or cut off?"
  applies_when: [engine_stalls]
  options:
    - id: stalls_at_idle_signals
      label: "When coming to a complete stop or red light"
      keywords: ["stop", "red light", "idle", "traffic light"]
      effects: {bad_throttle_body: 0.7, faulty_spark_plugs: 0.3}
    - id: stalls_while_cruising
      label: "Suddenly cuts out while driving at speed"
      keywords: ["cruising", "driving", "highway", "at speed"]
      effects: {crankshaft_position_sensor_failure: 0.7, failing_alternator: 0.4}

- key: q_stalls_restart
  text: "Does the engine restart immediately after stalling?"
  applies_when: [engine_stalls]
  options:
    - id: restarts_immediately
      label: "Yes, starts right back up on the first try"
      keywords: ["yes", "immediately", "right away"]
      effects: {bad_throttle_body: 0.5, faulty_spark_plugs: 0.3}
    - id: needs_cooling_time
      label: "No, cranks and only starts after 10-15 minutes"
      keywords: ["needs time", "after cooling", "wait"]
      effects: {crankshaft_position_sensor_failure: 0.7, fuel_pump_failure: 0.4}

# 9-10: rough_idle
- key: q_rough_idle_ac
  text: "Does the engine shake more violently when you turn the AC on?"
  applies_when: [rough_idle]
  options:
    - id: worse_with_ac_on
      label: "Yes, vibrations jump significantly with AC"
      keywords: ["yes", "worse with ac", "with ac"]
      effects: {bad_throttle_body: 0.6, faulty_spark_plugs: 0.4}
    - id: same_with_ac_off
      label: "Vibrates equally whether AC is on or off"
      keywords: ["same", "no difference", "equal"]
      effects: {bad_ignition_coils: 0.5, faulty_spark_plugs: 0.4}

- key: q_rough_idle_cold
  text: "Does the rough vibration smooth out once the engine warms up?"
  applies_when: [rough_idle]
  options:
    - id: smooths_out_warm
      label: "Yes, becomes smoother as temperature rises"
      keywords: ["smooths out", "better warm", "fine when hot"]
      effects: {faulty_spark_plugs: 0.6, bad_throttle_body: 0.3}
    - id: rough_all_the_time
      label: "Continues shaking even at full operating temperature"
      keywords: ["all the time", "continuous", "always rough"]
      effects: {bad_ignition_coils: 0.6, leaking_fuel_injector: 0.4}

# 11-12: low_power
- key: q_low_power_speed
  text: "When you press the accelerator hard, what happens to engine revs?"
  applies_when: [low_power]
  options:
    - id: revs_rise_no_speed
      label: "RPM needle shoots up but car doesn't pick up speed"
      keywords: ["revs climb", "rpm shoots up", "engine screams"]
      effects: {worn_clutch_friction_plate: 0.8, clogged_fuel_filter: -0.2}
    - id: sluggish_revs_and_choking
      label: "Engine hesitates, sputters, and struggles to gain RPM"
      keywords: ["hesitates", "sputters", "choking", "struggles"]
      effects: {clogged_fuel_filter: 0.6, clogged_catalytic_converter: 0.5}

- key: q_low_power_uphill
  text: "Is the lack of power most noticeable when climbing flyovers or hills?"
  applies_when: [low_power]
  options:
    - id: bogging_uphill
      label: "Yes, severely loses speed on inclines"
      keywords: ["yes", "uphill", "flyover", "incline"]
      effects: {clogged_fuel_filter: 0.6, clogged_catalytic_converter: 0.5}
    - id: sluggish_everywhere
      label: "Sluggish across flat roads as well"
      keywords: ["everywhere", "flat road", "always"]
      effects: {bad_ignition_coils: 0.5, faulty_spark_plugs: 0.4}

# 13-14: poor_mileage
- key: q_poor_mileage_smoke
  text: "Have you noticed any dark exhaust smoke or unburned smell?"
  applies_when: [poor_mileage]
  options:
    - id: black_exhaust_smoke
      label: "Yes, dark exhaust smoke when accelerating"
      keywords: ["yes", "black smoke", "dark smoke"]
      effects: {rich_fuel_mixture: 0.7, faulty_o2_sensor: 0.5}
    - id: clean_tailpipe
      label: "Exhaust looks clear with no smoke"
      keywords: ["clean", "no smoke", "clear"]
      effects: {faulty_o2_sensor: 0.6, faulty_spark_plugs: 0.4}

- key: q_poor_mileage_driving
  text: "Has the engine pickup or smoothness degraded along with fuel mileage?"
  applies_when: [poor_mileage]
  options:
    - id: sluggish_and_jerky
      label: "Yes, pickup is sluggish with subtle jerks"
      keywords: ["sluggish", "jerky", "pickup low"]
      effects: {faulty_spark_plugs: 0.6, rich_fuel_mixture: 0.4}
    - id: drives_normally
      label: "Car drives normally but mileage dropped sharply"
      keywords: ["drives normally", "fine", "normal pickup"]
      effects: {faulty_o2_sensor: 0.7}

# 15-16: overheating
- key: q_overheating_traffic
  text: "Does the temperature rise primarily in standstill city traffic?"
  applies_when: [overheating]
  options:
    - id: overheating_in_traffic
      label: "Yes, overheats at traffic signals, cools on highway"
      keywords: ["traffic", "jam", "signals", "idling"]
      effects: {low_coolant: 0.6, radiator_leak: 0.4}
    - id: overheating_on_highway
      label: "Overheats even while cruising at speed on open roads"
      keywords: ["highway", "cruising", "high speed"]
      effects: {stuck_thermostat: 0.7, failed_head_gasket: 0.5}

- key: q_overheating_steam
  text: "Do you see steam billowing from under the hood?"
  applies_when: [overheating]
  options:
    - id: visible_steam_from_hood
      label: "Yes, visible white steam and boiling noise"
      keywords: ["yes", "steam", "boiling", "hissing"]
