    - id: hot_needle_no_steam
      label: "No steam, just temperature gauge pinned high"
      keywords: ["no steam", "gauge in red", "hot needle"]
      effects: {low_coolant: 0.6, stuck_thermostat: 0.5}

# 17-18: coolant_leak
