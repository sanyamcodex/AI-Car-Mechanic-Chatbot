  description: "Loose or oil-contaminated accessory belt causing screech and poor charging."
  severity: 2
  service: alternator_starter_service
  symptoms:
    headlights_dim: 0.65
    battery_light: 0.70
    burning_smell: 0.60

- key: burnt_headlight_bulb_fuse
  label: "Blown headlight relay or bulb filament"
  description: "Filament burned out or relay contacts charred causing dim beam."
  severity: 1
  service: headlight_lighting_service
  symptoms:
    headlights_dim: 0.85

- key: severe_tire_tread_separation
  label: "Internal tire tread belt separation"
