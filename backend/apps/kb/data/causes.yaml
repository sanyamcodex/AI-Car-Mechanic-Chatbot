  service: exhaust_emission_service
  symptoms:
    check_engine_light: 0.85
    poor_mileage: 0.80

- key: clogged_catalytic_converter
  label: "Restricted catalytic converter"
  description: "Melted ceramic honeycomb restricting exhaust gas flow."
  severity: 3
  service: exhaust_emission_service
  symptoms:
    low_power: 0.80
    burning_smell: 0.45
    check_engine_light: 0.60

- key: faulty_abs_wheel_speed_sensor
  label: "Damaged ABS wheel speed sensor"
  description: "Magnetic encoder or sensor wire broken causing ABS brake warning."
  severity: 2
  service: electrical_diagnostic_service
  symptoms:
    abs_light: 0.95

- key: bad_throttle_body
  label: "Carbonized electronic throttle body"
  description: "Gum and carbon preventing butterfly valve from maintaining stable idle."
  severity: 2
  service: ignition_tuneup_service
  symptoms:
    rough_idle: 0.80
    engine_stalls: 0.85

- key: fuel_pump_failure
  label: "In-tank fuel pump electrical failure"
  description: "Electric motor open circuit preventing fuel pressure buildup."
  severity: 3
  service: fuel_system_service
  symptoms:
    engine_cranks_no_start: 0.90
    engine_stalls: 0.60

- key: alternator_serpentine_belt_slip
