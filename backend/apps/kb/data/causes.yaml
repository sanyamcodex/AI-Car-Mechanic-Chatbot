    vibration_speed: 0.70
    steering_vibration: 0.65

- key: melted_electrical_harness
  label: "Short circuited electrical wiring harness"
  description: "Wire insulation rubbed against engine block causing smoke and short."
  severity: 4
  service: electrical_diagnostic_service
  symptoms:
    burning_smell: 0.90
    battery_drain: 0.40

- key: worn_sway_bar_bushings
  label: "Worn sway bar bushings and end-links"
  description: "Loose stabilizer bar links knocking when chassis twists over uneven surface."
  severity: 1
  service: suspension_service
  symptoms:
    clunk_bumps: 0.85

- key: crankshaft_position_sensor_failure
  label: "Faulty crankshaft position sensor"
  description: "Thermal failure of crank angle sensor cutting off ignition pulse."
  severity: 3
  service: electrical_diagnostic_service
  symptoms:
    engine_stalls: 0.90
    engine_cranks_no_start: 0.80
    check_engine_light: 0.65
